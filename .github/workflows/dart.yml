on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

name: "Release on github and send email"
jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        run: |
          echo "Installing Android SDK..."
          sudo apt-get update
          sudo apt-get install -y aapt

      - name: Unzip release.zip file
        run: |
          tar -xvf app-release.tgz 

      - name: Extract APK Version
        run: |
          if [[ ! -f "app-release.apk" ]]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          
          APK_VERSION=$(aapt dump badging app-release.apk | awk -F"versionName='" '{print $2}' | awk -F"'" '{print $1}')
          
          if [[ -z "$APK_VERSION" ]]; then
            echo "Error: Failed to extract APK version!"
            exit 1
          fi

          NEW_APK_NAME="hrms_v${APK_VERSION}.apk"
          mv app-release.apk "$NEW_APK_NAME"

          echo "APK_VERSION=$APK_VERSION" >> $GITHUB_ENV
          echo "APK_FILE=$NEW_APK_NAME" >> $GITHUB_ENV
          echo "Extracted APK Version: $APK_VERSION"
          echo "Renamed APK: $NEW_APK_NAME"

      - name: Push to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.APK_FILE }}
          tag: ${{ env.APK_VERSION }}
          token: ${{ secrets.PUBLIC_REPO }}

      - name: Set release URL
        run: echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/download/${{ env.APK_VERSION }}/${{ env.APK_FILE }}" >> $GITHUB_ENV

      - name: Update JSON File for app update
        run: |
         echo "Download URL: $RELEASE_URL"
         echo '{
          "version": "'${{ env.APK_VERSION }}'",
          "url": "'$RELEASE_URL'"
         }' > check_app_version.json 

      - name: Commit and Push JSON File
        run: |
         git config --global user.email "bhavish@salaryontime.com"
         git config --global user.name "BhavishBhavish"
         git add check_app_version.json
         git commit -m "Updated custom.json file"
         git push

